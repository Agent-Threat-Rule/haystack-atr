[project]
name = "haystack-atr"
version = "0.1.0"
description = "Agent Threat Rules for Haystack agents: local, no-network checks on tool calls, tool results and messages"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Agent Threat Rules" }]
dependencies = ["haystack-ai>=3.4.0", "pyatr>=0.5.0"]

[project.urls]
Homepage = "https://github.com/Agent-Threat-Rule/agent-threat-rules"
Issues = "https://github.com/Agent-Threat-Rule/haystack-atr/issues"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/haystack_atr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
